<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#fbf6ee"><title>Wedding Invitation</title>
<link rel="stylesheet" href="style.css">
<noscript><style>[data-reveal]{opacity:1;transform:none}.cover{display:none}body.locked{overflow:auto}</style></noscript>
</head><body class="locked">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<symbol id="corner" viewBox="0 0 120 120"><path d="M4 116V30C4 14 14 4 30 4H116" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="300"/><path d="M14 106V36C14 24 24 14 36 14H106" fill="none" stroke="currentColor" stroke-width=".8" opacity=".6" stroke-dasharray="300"/><circle cx="30" cy="30" r="4" fill="currentColor"/><path d="M44 30C52 22 62 22 68 30C62 34 52 34 44 30Z" fill="currentColor" opacity=".7"/><path d="M30 44C22 52 22 62 30 68C34 62 34 52 30 44Z" fill="currentColor" opacity=".7"/></symbol>
<symbol id="divider" viewBox="0 0 240 24"><path d="M10 12H100M140 12H230" stroke="currentColor" fill="none" opacity=".6" stroke-dasharray="100"/><path d="M120 4C112 8 112 16 120 20C128 16 128 8 120 4Z" fill="currentColor" opacity=".85"/><path d="M104 12C98 8 92 9 88 12C92 15 98 16 104 12Z" fill="currentColor" opacity=".6"/><path d="M136 12C142 8 148 9 152 12C148 15 142 16 136 12Z" fill="currentColor" opacity=".6"/></symbol>
<symbol id="pin" viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="10" r="2.6" fill="currentColor"/></symbol>
<symbol id="heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.8-8 11-8 11Z" fill="currentColor"/></symbol>
<radialGradient id="sealG" cx="38%" cy="32%" r="75%"><stop offset="0" style="stop-color:var(--seal-1)"/><stop offset=".55" style="stop-color:var(--seal-2)"/><stop offset="1" style="stop-color:var(--seal-3)"/></radialGradient>
<radialGradient id="sealH" cx="32%" cy="26%" r="46%"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="sealS" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity=".38"/></filter>
</defs></svg>

<div class="progress" id="progress" aria-hidden="true"></div>

<div class="cover" id="cover" data-state="sealed">
  <div class="glow" aria-hidden="true"></div>
  <div class="stage">
    <div class="envelope">
      <div class="back"></div>
      <div class="card"><p class="card-eyebrow">You are invited</p><p class="card-names" id="cardNames"></p></div>
      <div class="pocket"></div>
      <div class="flap"><i class="ff"></i><i class="fb"></i></div>
      <button class="seal-btn" type="button" data-reveal-trigger aria-label="Open the invitation">
        <svg viewBox="0 0 140 140" width="104" height="104" aria-hidden="true" focusable="false">
          <path filter="url(#sealS)" fill="url(#sealG)" d="M70 8c10 0 14 7 23 9 9 2 18 4 22 13s-2 15 1 24 11 14 8 24-14 12-19 20-5 18-15 21-17-5-26-5-17 8-26 5-10-13-15-21-16-11-19-20 5-15 8-24-3-15 1-24 13-11 22-13 13-9 23-9z"/>
          <circle cx="70" cy="70" r="41" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="2"/>
          <circle cx="70" cy="70" r="35" fill="none" stroke="#000" stroke-opacity=".16" stroke-width="1.2" stroke-dasharray="1.5 4"/>
          <text class="sealT" x="70.8" y="81" text-anchor="middle" font-size="30" fill="#000" fill-opacity=".28" font-family="Cormorant Garamond,Georgia,serif"></text>
          <text class="sealT" x="70" y="80" text-anchor="middle" font-size="30" style="fill:var(--seal-ink)" font-family="Cormorant Garamond,Georgia,serif"></text>
          <ellipse cx="52" cy="40" rx="30" ry="20" fill="url(#sealH)" transform="rotate(-24 52 40)"/>
        </svg>
      </button>
    </div>
  </div>
  <p class="hint" id="hint"></p>
</div>

<main id="app"></main>
<script src="config.js"></script>
<script src="script.js"></script>
<script src="map.js"></script>
</body></html>
